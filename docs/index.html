<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ROIC Monte Carlo – interaktywna analiza</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
  </head>
  <body>
    <header>
      <h1>ROIC Monte Carlo – interaktywna analiza</h1>
      <p>Wybierz zmienne, zawęź zakresy i zobacz jak kształtuje się ROIC.</p>
    </header>

    <section class="controls">
      <div class="control">
        <label for="mode">Tryb wykresu</label>
        <select id="mode">
          <option value="2d">2D (ROIC vs X)</option>
          <option value="3d">3D (ROIC vs X,Y)</option>
        </select>
      </div>
      <div class="control">
        <label for="xSelect">Oś X</label>
        <select id="xSelect"></select>
      </div>
      <div class="control" id="yControl" style="display:none">
        <label for="ySelect">Oś Y</label>
        <select id="ySelect"></select>
      </div>
      <div class="control">
        <label for="roicMin">ROIC min</label>
        <input id="roicMin" type="number" step="0.0001" placeholder="auto" />
      </div>
      <div class="control">
        <label for="roicMax">ROIC max</label>
        <input id="roicMax" type="number" step="0.0001" placeholder="auto" />
      </div>
      <div class="control">
        <label for="xMin">X min</label>
        <input id="xMin" type="number" step="0.0001" placeholder="auto" />
      </div>
      <div class="control">
        <label for="xMax">X max</label>
        <input id="xMax" type="number" step="0.0001" placeholder="auto" />
      </div>
      <div class="control" id="yMinControl" style="display:none">
        <label for="yMin">Y min</label>
        <input id="yMin" type="number" step="0.0001" placeholder="auto" />
      </div>
      <div class="control" id="yMaxControl" style="display:none">
        <label for="yMax">Y max</label>
        <input id="yMax" type="number" step="0.0001" placeholder="auto" />
      </div>
      <div class="control">
        <button id="resetBtn">Reset filtrów</button>
      </div>
    </section>

    <main class="grid">
      <div id="scatter" class="card full"></div>
      <div id="hist" class="card"></div>
      <div id="stats" class="card"></div>
      <div id="betas" class="card"></div>
    </main>

    <footer>
      <small>Źródło: wyniki z symulacji (CSV w <code>docs/data/</code>). Strona responsywna – działa na komórce.</small>
    </footer>

    <script src="./app.js"></script>
  </body>
  </html>
